name: ESP-IDF Build
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Generate throwaway TLS files (real ones are never in git)
        working-directory: main
        run: |
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 30 \
            -subj "/CN=CI throwaway management CA" -keyout /tmp/ca.key -out management_ca.pem
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 30 \
            -subj "/CN=ci-build.invalid" -keyout serverkey.pem -out servercert.pem
      - name: Build firmware (ESP-IDF v6.1, esp32p4)
        run: |
          docker run --rm \
            -e IDF_TARGET=esp32p4 \
            -e IDF_GIT_SAFE_DIR=/project \
            -v "$GITHUB_WORKSPACE:/project" \
            -w /project \
            espressif/idf:v6.1 \
            bash -c "idf.py build size && idf.py merge-bin -o /project/build/merged-firmware.bin"
      - name: Upload firmware and build configuration
        uses: actions/upload-artifact@v4
        with:
          name: nts-time-server-esp32p4-idf-v6.1
          path: |
            build/*.bin
            build/*.elf
            build/*.map
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flasher_args.json
            sdkconfig
          if-no-files-found: error

  # Public firmware releases are disabled: the image embeds the console's TLS key and
  # management CA, which must not come from CI or be published. Build files from CI runs
  # are kept as run artifacts (built with throwaway certs) for verification only.
