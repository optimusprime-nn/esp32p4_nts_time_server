site_name: ESP32-P4 GNSS Time Server
site_description: User guide for the ESP32-P4 GNSS stratum-1 NTP/NTS time server
site_url: https://optimusprime-nn.github.io/esp32p4_nts_time_server/
repo_url: https://github.com/optimusprime-nn/esp32p4_nts_time_server
repo_name: esp32p4_nts_time_server
edit_uri: ""
docs_dir: docs/site
copyright: GNU General Public License v3.0

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font: false
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

extra_css:
  - assets/site.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Getting started:
      - What you need: getting-started/what-you-need.md
      - Download: getting-started/download.md
      - Quick setup with the tool:
          - setup-tool/index.md
          - Windows, setup window: setup-tool/windows-window.md
          - Windows, console: setup-tool/windows-console.md
          - Linux, setup window: setup-tool/linux-window.md
          - Linux, terminal: setup-tool/linux-terminal.md
      - Manual setup: getting-started/manual-setup.md
      - Check that it works: getting-started/verify.md
  - Using the server:
      - Pointing clients at it: using/clients.md
      - Two servers: using/redundancy.md
      - The web console: using/web-console.md
      - Firmware updates and rollback: using/firmware-updates.md
      - Backup and restore: using/backup-restore.md
  - Reference:
      - Management API (v1): reference/api.md
      - Metrics: reference/metrics.md
      - Configuration settings: reference/configuration.md
      - Hardware and pins: reference/hardware.md
      - Network ports: reference/ports.md
  - Help:
      - Troubleshooting: help/troubleshooting.md
      - Security model: help/security.md
      - FAQ: help/faq.md
      - Known limitations: help/limitations.md
      - Release notes: help/release-notes.md
  - Building from source: building.md
